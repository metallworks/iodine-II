<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Library</title>
<link rel="stylesheet" href="app.css">
<style>
  .bar { display: flex; gap: 10px; align-items: center; margin-top: 18px; flex-wrap: wrap; max-width: calc(100% - 290px); }
  .bar .field { flex: 1; min-width: 220px; font-size: 15px; padding: 12px 14px; }
  .count { font-size: 13px; color: rgba(255,255,255,.7); }

  .shelf h2 { font-weight: normal; font-size: 20px; margin: 26px 0 10px; }
  .shelf h2 small { font-size: 13px; color: rgba(255,255,255,.6); margin-left: 6px; }

  .games {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 8px;
    text-shadow: none;
  }
  .g {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    padding: 8px 34px 8px 12px;
    border-radius: 8px;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    color: #fff;
    font: inherit;
    font-size: 14px;
    text-align: left;
    cursor: pointer;
    transition: background .15s ease, transform .15s ease, border-color .15s ease;
    overflow: hidden;
  }
  .g:hover, .g:focus-visible { background: rgba(255,255,255,.25); border-color: rgba(255,255,255,.4); transform: translateY(-2px); outline: none; }
  .g .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .g .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .star {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 24px; height: 24px; border: none; border-radius: 6px;
    background: transparent; color: rgba(255,255,255,.35); font-size: 16px; cursor: pointer; line-height: 1;
  }
  .star:hover { color: #fff; background: rgba(255,255,255,.12); }
  .star.on { color: #ffd34d; }
  .empty { color: rgba(255,255,255,.6); font-style: italic; padding: 10px 2px; }
  .more { margin-top: 14px; }

  .status { margin-top: 30px; padding: 18px; max-width: 520px; }

  /* the player */
  .player {
    position: fixed; inset: 0; z-index: 50;
    display: none; flex-direction: column;
    background: #000;
  }
  .player.open { display: flex; }
  .player-top {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    background: rgba(18,18,24,.95);
    border-bottom: 1px solid rgba(255,255,255,.1);
  }
  .player-top .t { flex: 1; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player-top .s { font-size: 12px; color: rgba(255,255,255,.55); margin-right: 6px; }
  .player-top .btn { padding: 6px 11px; font-size: 13px; }
  .player iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  .player .loading {
    position: absolute; inset: 52px 0 0 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; color: #fff; background: #0b0713; font-size: 16px;
  }
  .player .loading.gone { display: none; }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.2); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 800px) { .bar { max-width: none; } }
</style>
</head>
<body>
<img class="top-right-center" src="Iodine.png" alt="">
<div class="bg-img"></div>

<div class="content">
  <h1>Game Library</h1>
  <p>Every game from Old Reliable, searchable, and they open right here. Hit the star to save a favorite.</p>

  <div class="bar">
    <input class="field" id="q" type="search" placeholder="Search games..." autocomplete="off" aria-label="Search games">
    <button class="btn" id="random">Random game</button>
    <span class="count" id="count"></span>
  </div>

  <div id="status" class="panel status">Loading the game list...</div>

  <section class="shelf" id="recent-shelf" hidden>
    <h2>Recently played</h2>
    <div class="games" id="recent"></div>
  </section>
  <section class="shelf" id="fav-shelf" hidden>
    <h2>Favorites</h2>
    <div class="games" id="favs"></div>
  </section>
  <section class="shelf" id="all-shelf" hidden>
    <h2 id="all-title">All games</h2>
    <div class="games" id="all"></div>
    <button class="btn more" id="more" hidden>Show more</button>
  </section>
</div>

<div class="player" id="player" role="dialog" aria-label="Game">
  <div class="player-top">
    <div class="t" id="p-title"></div>
    <span class="s" id="p-server"></span>
    <button class="btn" id="p-next" title="Load it from a different server">Not loading? Try another</button>
    <button class="btn" id="p-tab">New tab</button>
    <button class="btn" id="p-fs">Fullscreen</button>
    <button class="btn" id="p-close">Close</button>
  </div>
  <iframe id="p-frame" title="Game" allow="fullscreen; autoplay; gamepad; clipboard-write"></iframe>
  <div class="loading" id="p-loading"><div class="spinner"></div><div id="p-msg">Loading...</div></div>
</div>

<script>
(function () {
  'use strict';

  /* ---------------------------------------------------------------- where games live
     Everything here is a copy of bubbls' "Ultimate Game Stash" (the same
     files Old Reliable uses). Each game can come from any of these, and if
     one host is blocked or down the next is tried. No githack: filters
     block it by name. */
  var LIST_SOURCES = [
    'https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/games.js',
    'https://fastly.jsdelivr.net/gh/bubbls/ugs-singlefile@main/games.js',
    'https://gcore.jsdelivr.net/gh/bubbls/ugs-singlefile@main/games.js',
    'https://raw.githubusercontent.com/bubbls/ugs-singlefile/main/games.js',
    'https://cdn.statically.io/gh/bubbls/ugs-singlefile@main/games.js'
  ];

  function gameSources(file) {
    var f = encodeURIComponent(file);
    return [
      'https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/UGS-Files/' + f,
      'https://fastly.jsdelivr.net/gh/bubbls/ugs-singlefile@main/UGS-Files/' + f,
      'https://gcore.jsdelivr.net/gh/bubbls/ugs-singlefile@main/UGS-Files/' + f,
      'https://testingcf.jsdelivr.net/gh/bubbls/ugs-singlefile@main/UGS-Files/' + f,
      'https://raw.githubusercontent.com/bubbls/ugs-singlefile/main/UGS-Files/' + f,
      'https://cdn.statically.io/gh/bubbls/ugs-singlefile@main/UGS-Files/' + f,
      /* bubbls' second repo: the same games, at the top level */
      'https://cdn.jsdelivr.net/gh/bubbls/UGS-Files@main/' + f,
      'https://raw.githubusercontent.com/bubbls/UGS-Files/main/' + f
    ];
  }

  var TIMEOUT_MS = 9000;
  var PAGE = 300;

  /* ---------------------------------------------------------------- storage */
  function load(key, fallback) {
    try { var r = localStorage.getItem('iodine22_' + key); return r === null ? fallback : JSON.parse(r); }
    catch (e) { return fallback; }
  }
  function save(key, v) { try { localStorage.setItem('iodine22_' + key, JSON.stringify(v)); } catch (e) {} }

  var favs = load('favs', []);
  var recent = load('recent', []);

  /* ---------------------------------------------------------------- names */
  /* The files are named like "clretrobowl" or "clA Walk in The Forest (v10)".
     Drop the "cl", tidy the rest. */
  function prettyName(file) {
    var n = file.replace(/\.html?$/i, '');
    if (/^cl./i.test(n)) n = n.slice(2);
    n = n.replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim();
    return n.charAt(0).toUpperCase() + n.slice(1);
  }
  function fileFor(name) {
    return /\.[a-z0-9]{2,5}$/i.test(name) ? name : name + '.html';
  }
  function hue(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
    return 'hsl(' + h + ', 70%, 62%)';
  }

  /* ---------------------------------------------------------------- fetching */
  function fetchText(url) {
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, TIMEOUT_MS);
    return fetch(url, { mode: 'cors', credentials: 'omit', referrerPolicy: 'no-referrer', signal: ctl ? ctl.signal : undefined })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (t) { clearTimeout(timer); return t; },
            function (e) { clearTimeout(timer); throw e; });
  }

  function firstThatWorks(urls, check) {
    var i = 0;
    function next() {
      if (i >= urls.length) return Promise.reject(new Error('every server refused'));
      var u = urls[i++];
      return fetchText(u).then(function (t) {
        if (check && !check(t)) throw new Error('bad answer');
        return { text: t, url: u, index: i - 1 };
      }).catch(next);
    }
    return next();
  }

  /* Pulls the names out of games.js without running it. */
  function namesFrom(js) {
    var start = js.indexOf('[', js.indexOf('files'));
    var end = js.indexOf('];', start);
    if (start === -1 || end === -1) return [];
    var block = js.slice(start, end);
    var out = [];
    var re = /"((?:[^"\\]|\\.)*)"/g, m;
    while ((m = re.exec(block))) { try { out.push(JSON.parse('"' + m[1] + '"')); } catch (e) {} }
    return out;
  }

  /* ---------------------------------------------------------------- the list */
  var games = [];           /* { file, name, key } */
  var byFile = {};
  var shown = PAGE;

  var $ = function (id) { return document.getElementById(id); };
  var status = $('status');

  function tile(g) {
    var b = document.createElement('button');
    b.className = 'g';
    b.type = 'button';
    b.title = g.name;
    var dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = hue(g.name);
    var name = document.createElement('span');
    name.className = 'name';
    name.textContent = g.name;
    var star = document.createElement('span');
    star.className = 'star' + (favs.indexOf(g.file) !== -1 ? ' on' : '');
    star.setAttribute('role', 'button');
    star.setAttribute('aria-label', 'Favorite');
    star.textContent = '★';
    star.addEventListener('click', function (e) {
      e.stopPropagation();
      toggleFav(g.file);
    });
    b.appendChild(dot);
    b.appendChild(name);
    b.appendChild(star);
    b.addEventListener('click', function () { play(g); });
    return b;
  }

  function fill(el, list, emptyText) {
    el.innerHTML = '';
    if (!list.length) {
      var d = document.createElement('div');
      d.className = 'empty';
      d.textContent = emptyText || 'Nothing here.';
      el.appendChild(d);
      return;
    }
    var frag = document.createDocumentFragment();
    list.forEach(function (g) { frag.appendChild(tile(g)); });
    el.appendChild(frag);
  }

  function render() {
    var q = $('q').value.trim().toLowerCase();
    var hits = q ? games.filter(function (g) { return g.key.indexOf(q.replace(/[^a-z0-9]/g, '')) !== -1 || g.name.toLowerCase().indexOf(q) !== -1; }) : games;

    var rec = recent.map(function (f) { return byFile[f]; }).filter(Boolean);
    var fav = favs.map(function (f) { return byFile[f]; }).filter(Boolean)
      .sort(function (a, b) { return a.name.localeCompare(b.name); });

    $('recent-shelf').hidden = !!q || !rec.length;
    $('fav-shelf').hidden = !!q || !fav.length;
    fill($('recent'), rec);
    fill($('favs'), fav);

    $('all-shelf').hidden = false;
    $('all-title').textContent = q ? 'Results for "' + $('q').value.trim() + '"' : 'All games';
    fill($('all'), hits.slice(0, shown), 'No games match that. Try fewer letters.');
    $('more').hidden = hits.length <= shown;
    $('more').textContent = 'Show more (' + (hits.length - shown) + ' left)';
    $('count').textContent = q ? hits.length + ' of ' + games.length : games.length + ' games';
  }

  function toggleFav(file) {
    var i = favs.indexOf(file);
    if (i === -1) favs.push(file); else favs.splice(i, 1);
    save('favs', favs);
    render();
  }

  var t = null;
  $('q').addEventListener('input', function () {
    clearTimeout(t);
    t = setTimeout(function () { shown = PAGE; render(); }, 120);
  });
  $('more').addEventListener('click', function () { shown += PAGE; render(); });
  $('random').addEventListener('click', function () {
    if (games.length) play(games[Math.floor(Math.random() * games.length)]);
  });

  firstThatWorks(LIST_SOURCES, function (t) { return namesFrom(t).length > 50; })
    .then(function (res) {
      var seen = {};
      namesFrom(res.text).forEach(function (raw) {
        var file = fileFor(raw);
        if (seen[file] || !/[a-z0-9]/i.test(prettyName(raw))) return;
        seen[file] = true;
        var g = { file: file, name: prettyName(raw) };
        g.key = g.name.toLowerCase().replace(/[^a-z0-9]/g, '');
        games.push(g);
        byFile[file] = g;
      });
      games.sort(function (a, b) { return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }); });
      status.hidden = true;
      render();
      $('q').focus();
    })
    .catch(function () {
      status.textContent = 'The game list would not load from any of its five servers. Your network might be blocking them. Old Reliable (back on the Games page) uses a different route, so try that, or Iodine 3.';
    });

  /* ---------------------------------------------------------------- the player */
  var player = $('player');
  var frame = $('p-frame');
  var loading = $('p-loading');
  var current = null;        /* { game, urls, index, html } */
  var token = 0;

  /* Single-file games mostly carry everything inside them. The ones that
     load extra files need to know where they came from - so unless the
     page already says (its own <base>), it is told. */
  function withBase(html, url) {
    if (/<base\s[^>]*href=/i.test(html)) return html;
    var tag = '<base href="' + url.slice(0, url.lastIndexOf('/') + 1) + '">';
    if (/<head[^>]*>/i.test(html)) return html.replace(/<head[^>]*>/i, function (m) { return m + tag; });
    return tag + html;
  }

  function play(g) {
    current = { game: g, urls: gameSources(g.file), index: 0, html: '' };
    recent = [g.file].concat(recent.filter(function (f) { return f !== g.file; })).slice(0, 12);
    save('recent', recent);
    $('p-title').textContent = g.name;
    player.classList.add('open');
    tryFrom(0);
  }

  function tryFrom(start) {
    var my = ++token;
    loading.classList.remove('gone');
    frame.removeAttribute('srcdoc');
    frame.src = 'about:blank';
    var urls = current.urls.slice(start);
    $('p-msg').textContent = 'Loading ' + current.game.name + '...';
    firstThatWorks(urls, function (t) { return /<html|<head|<body|<script|<canvas/i.test(t); })
      .then(function (res) {
        if (my !== token) return;
        current.index = start + res.index;
        current.html = withBase(res.text, res.url);
        $('p-server').textContent = 'Server ' + (current.index + 1) + ' of ' + current.urls.length;
        frame.onload = function () {
          if (my !== token) return;
          try { if (frame.contentWindow.location.href !== 'about:srcdoc') return; } catch (e) {}
          loading.classList.add('gone');
          frame.focus();
          if (parent && parent.iodineHookFrame) { parent.iodineHookFrame(frame.contentWindow); }
        };
        frame.srcdoc = current.html;
      })
      .catch(function () {
        if (my !== token) return;
        $('p-msg').textContent = 'None of the ' + current.urls.length + ' servers would hand this game over. Your network may be blocking all of them - try another game, or Iodine 3.';
        loading.querySelector('.spinner').style.display = 'none';
      });
    loading.querySelector('.spinner').style.display = '';
  }

  function closePlayer() {
    token++;
    player.classList.remove('open');
    frame.removeAttribute('srcdoc');
    frame.src = 'about:blank';
    if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
    render();
  }

  $('p-close').addEventListener('click', closePlayer);
  $('p-next').addEventListener('click', function () {
    if (!current) return;
    tryFrom((current.index + 1) % current.urls.length);
  });
  $('p-fs').addEventListener('click', function () {
    var el = frame;
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) req.call(el);
  });
  $('p-tab').addEventListener('click', function () {
    if (!current || !current.html) return;
    var w = window.open('about:blank', '_blank');
    if (!w) return;
    w.document.open();
    w.document.write(current.html);
    w.document.close();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && player.classList.contains('open') && !document.fullscreenElement) closePlayer();
  });
})();
</script>
</body>
</html>
